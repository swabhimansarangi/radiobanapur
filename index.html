<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Banapur - Live Stream</title>
    <style>
        :root {
            --grad: linear-gradient(135deg, #00c6ff 0%, #7b2ff7 50%, #f107a3 100%);
            --yellow: #ffc233;
            --orange: #ff8a00;
            --bg-deep: #06061c;
            --bg-card: #0d0d2b;
            --text-main: #f5f6ff;
            --text-dim: #9aa0c3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(1200px 600px at 50% -10%, #1a1a4a 0%, transparent 60%),
                var(--bg-deep);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .player-card {
            background: var(--grad);
            border-radius: 28px;
            padding: 3px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6),
                        0 0 40px rgba(123, 47, 247, 0.25);
        }

        .card-inner {
            background: var(--bg-card);
            border-radius: 25px;
            padding: 35px 28px;
            text-align: center;
        }

        .logo-wrap {
            width: 190px;
            height: 190px;
            margin: 0 auto 22px;
            border-radius: 50%;
            padding: 4px;
            background: var(--grad);
            box-shadow: 0 0 30px rgba(0, 198, 255, 0.35),
                        0 0 30px rgba(241, 7, 163, 0.25);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .logo-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
            object-fit: cover;
            background: #06061c;
        }

        .logo-fallback {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            background: #06061c;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(241, 7, 163, 0.12);
            color: #ff5fa2;
            border: 1px solid rgba(241, 7, 163, 0.35);
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .live-dot {
            width: 9px;
            height: 9px;
            background: #ff2e63;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(255, 46, 99, 0.7); }
            70%  { box-shadow: 0 0 0 10px rgba(255, 46, 99, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 46, 99, 0); }
        }

        h1 {
            font-size: 1.9rem;
            line-height: 1.15;
            margin-bottom: 6px;
        }

        h1 .radio-word { color: var(--text-main); }
        h1 .banapur-word {
            background: linear-gradient(90deg, var(--yellow), var(--orange));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: italic;
            font-weight: 800;
        }

        .tagline {
            font-size: 1.05rem;
            color: var(--text-dim);
            margin-bottom: 24px;
        }

        .now-playing {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 24px;
            border-left: 4px solid;
            border-image: var(--grad) 1;
            text-align: left;
        }

        .now-playing-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .now-playing-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            word-wrap: break-word;
        }

        audio {
            width: 100%;
            height: 52px;
            border-radius: 26px;
            outline: none;
            filter: invert(0.92) hue-rotate(180deg);
        }

        .status-message {
            margin-top: 14px;
            font-size: 0.85rem;
            color: #ff5fa2;
            min-height: 20px;
        }

        .eq {
            display: flex;
            gap: 4px;
            justify-content: center;
            align-items: flex-end;
            height: 26px;
            margin-top: 20px;
        }
        .eq span {
            width: 5px;
            border-radius: 3px;
            background: var(--grad);
            animation: eq 1s ease-in-out infinite;
        }
        .eq span:nth-child(1){ animation-delay: 0.0s; height: 40%; }
        .eq span:nth-child(2){ animation-delay: 0.2s; height: 70%; }
        .eq span:nth-child(3){ animation-delay: 0.4s; height: 55%; }
        .eq span:nth-child(4){ animation-delay: 0.1s; height: 90%; }
        .eq span:nth-child(5){ animation-delay: 0.3s; height: 60%; }
        .eq span:nth-child(6){ animation-delay: 0.5s; height: 80%; }
        .eq span:nth-child(7){ animation-delay: 0.15s; height: 45%; }

        @keyframes eq {
            0%, 100% { transform: scaleY(0.4); }
            50% { transform: scaleY(1); }
        }

        .footer {
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 0.5px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .footer a {
            color: #00c6ff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border-bottom: 1px dashed rgba(0, 198, 255, 0.4);
        }

        .footer a:hover {
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            border-bottom-color: transparent;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="card-inner">

            <!-- LOGO: save your image as logo.png next to this file -->
            <div class="logo-wrap">
                <img src="logo.jpg" alt="Radio Banapur Logo"
                     onerror="this.outerHTML='<div class=\'logo-fallback\'>📻</div>'">
            </div>

            <div class="live-badge">
                <span class="live-dot"></span> Live On Air
            </div>

            <h1>
                <span class="radio-word">Radio</span><br>
                <span class="banapur-word">Banapur</span>
            </h1>
            <p class="tagline">ରେଡିଓ ବାଣପୁର - ଆମ ଗର୍ବର ସ୍ବର</p>

            <div class="now-playing">
                <div class="now-playing-label">Now Playing</div>
                <div class="now-playing-title" id="track-title"></div>
            </div>

            <audio id="radio-player" controls preload="none">
                <source src="https://sapircast.caster.fm:15549/zhHgE?token=8a89310d7ae6a563b5ee62f78c9a3000" type="audio/mpeg">
                <source src="http://sapircast.caster.fm:15549/zhHgE?token=8a89310d7ae6a563b5ee62f78c9a3000" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>

            <div class="status-message" id="status-msg"></div>

            <div class="eq">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>

            <div class="footer">
                <span>Powered by Caster.fm • Icecast Streaming</span>
                <a href="https://radiobanapur.ismyradio.com/" target="_blank" rel="noopener noreferrer">
                    Visit Official Website →
                </a>
            </div>
        </div>
    </div>

    <script>
        const player = document.getElementById('radio-player');
        const statusMsg = document.getElementById('status-msg');
        const trackTitle = document.getElementById('track-title');

        // HTTPS -> HTTP fallback (handles mixed-content blocking)
        player.addEventListener('error', function () {
            const currentSrc = player.querySelector('source').src;
            if (currentSrc.startsWith('https://')) {
                player.querySelector('source').src =
                    'http://sapircast.caster.fm:15549/zhHgE?token=8a89310d7ae6a563b5ee62f78c9a3000';
                player.load();
            } else {
                statusMsg.textContent = 'Stream is currently offline or unavailable.';
            }
        });

        player.play().catch(() => {
            statusMsg.textContent = 'Press ▶ to start listening';
        });

        // Live track updates from Icecast status API (every 30s)
        async function updateTrackInfo() {
            try {
                const res = await fetch('http://sapircast.caster.fm:15549/status-json.xsl');
                const data = await res.json();
                const src = data?.icestats?.source;
                const source = Array.isArray(src) ? src[0] : src;
                if (source?.title) trackTitle.textContent = source.title;
            } catch (e) {
                // CORS may block this — static title stays as fallback
            }
        }
        setInterval(updateTrackInfo, 30000);
        updateTrackInfo();
    </script>
</body>
</html>
